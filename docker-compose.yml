services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb:/var/lib/falkordb/data

  # `docker compose --profile app up` adds the worker; the web app runs with `pnpm --filter @noderunner/web dev`.
  worker:
    profiles: [app]
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      FALKORDB_URL: redis://falkordb:6379
      WEB_ORIGIN: http://localhost:3001
    ports:
      - "8787:8787"
    depends_on: [falkordb]

volumes:
  falkordb:
