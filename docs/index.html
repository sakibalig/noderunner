<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noderunner — a graph path behind every claim</title>
<meta name="description" content="An interactive walkthrough of Noderunner: dependency vulnerability triage on a FalkorDB graph. Graph Hacks 2026, Track 1.">
<style>
:root {
  --bg: #f6f4ee; --surface: #fff; --ink: #1c1b18; --muted: #6b6860; --line: #e2ded3;
  --accent: #b4451f; --accent-soft: #f5e1d7; --reach: #b4451f; --dev: #b9b5a8; --ok: #2f6f4f; --ok-soft: #dcefe4;
  --high: #b4451f; --moderate: #c48a1c; --critical: #8f1d1d; --low: #5b7a99; --step: #3d5a80;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace; --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.92em; }

header.top { display: flex; align-items: center; gap: 18px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .brand { font-weight: 700; font-size: 17px; }
header.top .tag { color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dots button.done { background: #d9b8a8; }
.dots button.on { background: var(--accent); transform: scale(1.3); }
.count { color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }

main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px 24px; height: calc(100% - 55px); }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; overflow-y: auto; }
.kicker { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.story h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 14px; }
.story p { margin: 0 0 12px; }
.story .note { color: var(--muted); font-size: 13px; }
.story ul { padding-left: 18px; margin: 0 0 12px; }
.story li { margin-bottom: 6px; }
.actions { margin-top: auto; padding-top: 16px; display: flex; gap: 10px; align-items: center; }
button.primary { background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; }
button.primary:hover { background: #000; }
button.primary.next { background: var(--accent); }
button.primary:disabled { opacity: 0.45; cursor: progress; }
button.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font: inherit; color: var(--muted); cursor: pointer; }
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }

.stage { position: relative; display: grid; grid-template-rows: 1fr auto; gap: 14px; min-height: 0; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); position: relative; overflow: hidden; min-height: 0; }
.canvas .label { position: absolute; top: 12px; left: 16px; font-size: 12px; color: var(--muted); font-family: var(--mono); z-index: 2; }
.canvas .badge { position: absolute; top: 10px; right: 14px; font-size: 12px; z-index: 2; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; overflow-y: auto; max-height: 36vh; }
.panel:empty { display: none; }
.view { position: absolute; inset: 0; padding: 44px 24px 20px; overflow-y: auto; display: none; }
.view.on { display: block; }
svg.graph { width: 100%; height: 100%; display: none; }
svg.graph.on { display: block; }

/* graph */
.node rect { fill: #fff; stroke: var(--line); stroke-width: 1.5; rx: 8; transition: all .35s; }
.node text { font: 11px var(--mono); fill: var(--ink); transition: opacity .35s; pointer-events: none; }
.node .sub { fill: var(--muted); font-size: 9.5px; }
.node.file rect { fill: #eef2f7; stroke: #9fb0c6; }
.node.vuln rect { fill: #fbeae4; stroke: #e2a68f; }
.node.dec rect { fill: #fff6dc; stroke: var(--moderate); }
.node.step rect { fill: #e7edf5; stroke: var(--step); }
.node.dev rect { fill: #f4f3ef; stroke: #d6d2c6; }
.node, .edge { opacity: 0; transition: opacity .45s; }
.shown { opacity: 1 !important; }
.shown.dim { opacity: 0.18 !important; }
.node.hot rect { stroke: var(--reach); stroke-width: 3; fill: #fff3ee; }
.node.vuln.hot rect { fill: var(--reach); }
.node.vuln.hot text { fill: #fff; }
.node.fixed rect { stroke: var(--ok); stroke-width: 3; fill: var(--ok-soft); }
.node.pulse rect { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { stroke-width: 6; } }
.edge path { fill: none; stroke: #cfcabd; stroke-width: 1.6; transition: stroke .35s, stroke-width .35s; }
.edge text { font: 9px var(--mono); fill: var(--muted); }
.edge.hot path { stroke: var(--reach); stroke-width: 3.2; }
.edge.missed path { stroke: var(--moderate); stroke-dasharray: 5 4; stroke-width: 2.4; }
.edge.memo path { stroke: var(--moderate); stroke-dasharray: 3 3; }
.edge.touch path { stroke: var(--step); stroke-dasharray: 2 3; }

/* panels */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; color: #fff; }
.pill.critical { background: var(--critical); } .pill.high { background: var(--high); } .pill.moderate { background: var(--moderate); } .pill.low { background: var(--low); }
.audit { font: 12px/1.5 var(--mono); background: #1c1b18; color: #e8e4d8; border-radius: 10px; padding: 14px 16px; height: 100%; overflow: hidden; position: relative; }
.audit .scroll { animation: scroll 22s linear infinite; }
@keyframes scroll { to { transform: translateY(-50%); } }
.audit .sev-critical { color: #ff8a80; } .audit .sev-high { color: #ffab91; } .audit .sev-moderate { color: #ffd180; } .audit .sev-low { color: #9fc3e6; }
.big { font-size: 64px; font-weight: 800; line-height: 1; color: var(--accent); }
.stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 120px; }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }
.stages { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.stages li { display: grid; grid-template-columns: 22px 110px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); transition: all .3s; }
.stages li .tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.stages li.done { color: var(--ink); border-color: #cfe3d6; background: #f6fbf7; }
.stages li.done .tick { background: var(--ok); border-color: var(--ok); }
.stages li b { font-family: var(--mono); font-size: 13px; }
.urlbox { display: flex; gap: 8px; margin-bottom: 14px; }
.urlbox div { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); background: var(--bg); }
pre.cypher { font: 12px/1.55 var(--mono); background: #1c1b18; color: #e8e4d8; padding: 12px 14px; border-radius: 10px; margin: 0 0 10px; white-space: pre-wrap; }
pre.cypher .k { color: #ffab91; } pre.cypher .c { color: #8f8a7d; }
.funnel { display: grid; gap: 8px; }
.funnel .row { display: grid; grid-template-columns: 170px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; }
.funnel .bar { height: 14px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.funnel .bar i { display: block; height: 100%; width: 0; border-radius: 6px; transition: width 1s ease; }
.funnel b { text-align: right; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; }
.chain span { padding: 4px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); opacity: .25; transition: all .3s; }
.chain span.on { opacity: 1; border-color: var(--reach); background: #fff3ee; }
.chain em { color: var(--muted); font-style: normal; opacity: .25; } .chain em.on { opacity: 1; }
.steps { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }
.steps li { display: grid; grid-template-columns: 18px 130px 1fr 50px; gap: 8px; font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; opacity: 0; transform: translateY(6px); transition: all .3s; }
.steps li.in { opacity: 1; transform: none; }
.steps li.sel { border-color: var(--reach); background: #fff3ee; }
.steps li .n { color: var(--muted); font-weight: 700; }
.steps li code { font-weight: 600; }
.steps li .ms { color: var(--muted); text-align: right; }
.report { font-size: 13.5px; }
.report:empty { display: none; }
.cite { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; text-align: center; border: 0; cursor: pointer; }
.cite.go { background: var(--accent); color: #fff; animation: pulse2 1s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
.typed { white-space: pre-wrap; }
.pipeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.pipeline li { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; opacity: .35; transition: all .3s; font-size: 13px; }
.pipeline li.on { opacity: 1; border-color: var(--ok); background: #f6fbf7; }
.pipeline li.stop { opacity: 1; border-color: var(--reach); background: #fff3ee; }
.pipeline li b { display: block; }
.diff { font: 12px/1.5 var(--mono); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.diff .add { color: var(--ok); }
.bars { display: grid; gap: 14px; }
.bars .row { display: grid; grid-template-columns: 200px 1fr 54px; gap: 12px; align-items: center; }
.bars .bar { height: 26px; background: var(--bg); border-radius: 8px; overflow: hidden; }
.bars .bar i { display: block; height: 100%; width: 0; transition: width 1.2s ease; border-radius: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.cards h3.span { grid-column: 1 / -1; margin: 6px 0 0; font-size: 14px; color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); opacity: 0; transform: translateY(8px); transition: all .35s; }
.card.in { opacity: 1; transform: none; }
.card b { display: block; margin-bottom: 4px; }
.card p { margin: 0; font-size: 13px; color: var(--muted); }
.title-hero { display: grid; place-items: center; height: 100%; text-align: center; padding: 30px; }
.title-hero h2 { font-size: 40px; line-height: 1.15; margin: 0 0 14px; max-width: 760px; }
.title-hero p { color: var(--muted); max-width: 620px; margin: 0 auto 8px; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 3; pointer-events: none; max-width: 90%; text-align: center; }
.toast.on { opacity: .92; }
.ok { color: var(--ok); font-weight: 700; }
.warn { color: var(--reach); font-weight: 700; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; height: auto; } .stage { min-height: 560px; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Noderunner</span>
  <span class="tag">a graph path behind every claim · interactive walkthrough</span>
  <nav class="dots" id="dots" aria-label="Scenes"></nav>
  <span class="count" id="count"></span>
</header>
<main>
  <section class="story" aria-live="polite">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div id="body"></div>
    <div class="actions">
      <button class="ghost" id="back" type="button">←</button>
      <button class="primary" id="go" type="button"></button>
      <span class="hint">or press →</span>

  </section>
  <section class="stage">
    <div class="canvas" id="canvas">
      <span class="label" id="glabel"></span>
      <span class="badge" id="gbadge"></span>
      <svg class="graph" id="graph" viewBox="0 0 940 440" role="img" aria-label="The repository graph"></svg>
      <div class="view" id="view"></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<script>
"use strict";
// Every number on these screens comes from a real run of Noderunner on nestjs/nest @ c215fd9 (October 2026):
// the triage run, the executor's dry run, and eval/results.md. Nothing here calls a server.

const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const svgNS = "http://www.w3.org/2000/svg";

// ---------- the graph: a faithful slice of repo:nestjs/nest ----------
const N = {
  // production files
  fIo: { x: 20, y: 50, w: 150, label: "io-adapter.ts", sub: "platform-socket.io", kind: "file" },
  fFa: { x: 20, y: 195, w: 150, label: "fastify-adapter.ts", sub: "platform-fastify", kind: "file" },
  fGr: { x: 20, y: 270, w: 150, label: "server-grpc.ts", sub: "microservices", kind: "file" },
  // installs on production paths
  sio: { x: 225, y: 50, w: 125, label: "socket.io", sub: "4.8.4" },
  sad: { x: 395, y: 15, w: 140, label: "socket.io-adapter", sub: "2.5.6" },
  ws: { x: 580, y: 15, w: 150, label: "ws", sub: "8.18.3" },
  spa: { x: 395, y: 85, w: 140, label: "socket.io-parser", sub: "4.2.6" },
  fst: { x: 225, y: 195, w: 125, label: "@fastify/static", sub: "10.1.6 · dev" },
  glob: { x: 395, y: 195, w: 90, label: "glob", sub: "13.0.6 · dev" },
  mm: { x: 520, y: 195, w: 100, label: "minimatch", sub: "10.2.5 · dev" },
  be: { x: 655, y: 195, w: 120, label: "brace-expansion", sub: "5.0.5 · dev" },
  grpc: { x: 225, y: 270, w: 125, label: "@grpc/grpc-js", sub: "1.14.6 · dev" },
  pl: { x: 395, y: 270, w: 130, label: "@grpc/proto-loader", sub: "0.8.1 · dev" },
  pb: { x: 570, y: 270, w: 110, label: "protobufjs", sub: "7.6.1 · dev" },
  // dev-only tree: nothing in production loads it
  lerna: { x: 225, y: 340, w: 125, label: "lerna", sub: "dev tool", kind: "dev" },
  tar: { x: 395, y: 340, w: 90, label: "tar", sub: "dev", kind: "dev" },
  gulp: { x: 225, y: 390, w: 125, label: "gulp-clean", sub: "dev tool", kind: "dev" },
  braces: { x: 395, y: 390, w: 90, label: "braces", sub: "dev", kind: "dev" },
  // advisories
  vWs: { x: 760, y: 15, w: 165, label: "GHSA-96hv · GHSA-58qx", sub: "ws · high, moderate", kind: "vuln" },
  vSp: { x: 760, y: 85, w: 165, label: "GHSA-2m8v", sub: "socket.io-parser · high", kind: "vuln" },
  vBe: { x: 805, y: 195, w: 120, label: "7 advisories", sub: "brace-expansion", kind: "vuln" },
  vPb: { x: 760, y: 270, w: 165, label: "GHSA-f38q · GHSA-j3f2", sub: "protobufjs · moderate", kind: "vuln" },
  vTar: { x: 560, y: 340, w: 165, label: "12 advisories", sub: "tar · dev-only", kind: "vuln" },
  vMore: { x: 560, y: 390, w: 165, label: "… 34 more", sub: "dev-only alerts", kind: "vuln" },
  // memory
  dec: { x: 760, y: 140, w: 165, label: "Decision: waive", sub: "@sakibalig · 90 days", kind: "dec" },
  step: { x: 225, y: 125, w: 125, label: "Step 3", sub: "reachability", kind: "step" },

const E = [
  ["fIo", "sio", "LOADS"], ["sio", "sad", "DEPENDS_ON"], ["sad", "ws", "DEPENDS_ON"], ["sio", "spa", "DEPENDS_ON"],
  ["fFa", "fst", "LOADS"], ["fst", "glob", ""], ["glob", "mm", ""], ["mm", "be", ""],
  ["grpc", "pl", ""], ["pl", "pb", ""], ["lerna", "tar", ""], ["gulp", "braces", ""],
  ["vWs", "ws", "AFFECTS"], ["vSp", "spa", "AFFECTS"], ["vBe", "be", ""], ["vPb", "pb", "AFFECTS"],
  ["vTar", "tar", ""], ["vMore", "braces", ""],
  ["fGr", "grpc", "createRequire — missed", "missed"],
  ["dec", "vWs", "", "memo"],
  ["step", "sio", "TOUCHED", "touch"], ["step", "fst", "", "touch"],
];
const H = 38;
const center = (n) => ({ x: n.x + n.w / 2, y: n.y + H / 2 });

function edgeId(a, b) { return `e-${a}-${b}`; }
function drawGraph() {
  const svg = $("graph");
  svg.innerHTML = "";
  for (const [a, b, label, extra] of E) {
    const A = N[a], B = N[b];
    const leftToRight = A.x < B.x;
    const s = leftToRight ? { x: A.x + A.w, y: A.y + H / 2 } : { x: A.x, y: A.y + H / 2 };
    const t = leftToRight ? { x: B.x, y: B.y + H / 2 } : { x: B.x + B.w, y: B.y + H / 2 };
    if (a === "dec") { s.x = A.x + A.w; s.y = A.y + H / 2; t.x = B.x + B.w; t.y = B.y + H / 2; }
    if (a === "step") { s.x = A.x + A.w / 2; s.y = b === "sio" ? A.y : A.y + H; t.x = B.x + B.w / 2; t.y = b === "sio" ? B.y + H : B.y; }
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", `edge${extra ? ` ${extra}` : ""}`);
    g.id = edgeId(a, b);
    const mx = (s.x + t.x) / 2;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", a === "dec" ? `M${s.x},${s.y} C${s.x + 14},${s.y} ${t.x + 14},${t.y} ${t.x},${t.y}` : a === "step" ? `M${s.x},${s.y} L${t.x},${t.y}` : `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`);
    g.appendChild(path);
    if (label) {
      const tx = document.createElementNS(svgNS, "text");
      tx.setAttribute("x", a === "dec" ? s.x - 22 : mx);
      tx.setAttribute("y", extra === "missed" ? s.y + 34 : (s.y + t.y) / 2 - 5);

      tx.textContent = label;
      g.appendChild(tx);
    }
    svg.appendChild(g);

  for (const [id, n] of Object.entries(N)) {
    const g = document.createElementNS(svgNS, "g");

    g.id = `n-${id}`;
    const r = document.createElementNS(svgNS, "rect");
    r.setAttribute("x", n.x); r.setAttribute("y", n.y); r.setAttribute("width", n.w); r.setAttribute("height", H);
    g.appendChild(r);
    const t1 = document.createElementNS(svgNS, "text");
    t1.setAttribute("x", n.x + 9); t1.setAttribute("y", n.y + 16); t1.textContent = n.label;
    const t2 = document.createElementNS(svgNS, "text");
    t2.setAttribute("x", n.x + 9); t2.setAttribute("y", n.y + 30); t2.setAttribute("class", "sub"); t2.textContent = n.sub;
    g.append(t1, t2);
    svg.appendChild(g);
  }
}
const node = (id) => document.getElementById(`n-${id}`);
const edge = (a, b) => document.getElementById(edgeId(a, b));
const allNodes = () => [...document.querySelectorAll(".node")];
const allEdges = () => [...document.querySelectorAll(".edge")];
function cls(el, add, ...names) { if (el) for (const n of names) el.classList.toggle(n, add); }
function reset() {
  for (const el of [...allNodes(), ...allEdges()]) el.classList.remove("shown", "dim", "hot", "fixed", "pulse");
  for (const [id, n] of Object.entries(N)) { const t = node(id)?.querySelectorAll("text")[1]; if (t) t.textContent = n.sub; }
}
function show(ids) { for (const id of ids) cls(node(id), true, "shown"); }
function showEdges(pairs) { for (const [a, b] of pairs) cls(edge(a, b), true, "shown"); }
const graphIds = ["fIo", "fFa", "fGr", "sio", "sad", "ws", "spa", "fst", "glob", "mm", "be", "grpc", "pl", "pb", "lerna", "tar", "gulp", "braces", "vWs", "vSp", "vBe", "vPb", "vTar", "vMore"];
const graphEdges = E.filter(([a, , , x]) => !x).map(([a, b]) => [a, b]);
const paths = {
  ws: [["fIo", "sio"], ["sio", "sad"], ["sad", "ws"], ["vWs", "ws"]],
  sp: [["fIo", "sio"], ["sio", "spa"], ["vSp", "spa"]],
  be: [["fFa", "fst"], ["fst", "glob"], ["glob", "mm"], ["mm", "be"], ["vBe", "be"]],
};
function heat(pairs, on = true) {
  for (const [a, b] of pairs) { cls(edge(a, b), on, "hot"); cls(node(a), on, "hot"); cls(node(b), on, "hot"); }
}
function fullGraph() { reset(); show(graphIds); showEdges(graphEdges); }
function reachableView() {
  fullGraph();
  for (const id of ["fGr", "grpc", "pl", "pb", "vPb", "lerna", "tar", "gulp", "braces", "vTar", "vMore"]) cls(node(id), true, "dim");
  for (const [a, b] of [["grpc", "pl"], ["pl", "pb"], ["vPb", "pb"], ["lerna", "tar"], ["gulp", "braces"], ["vTar", "tar"], ["vMore", "braces"]]) cls(edge(a, b), true, "dim");
  heat([...paths.ws, ...paths.sp, ...paths.be]);
}

// ---------- ui helpers ----------
function toast(text, ms = 2600) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), ms); }
function mode(m, label = "", badge = "") {
  $("graph").classList.toggle("on", m === "graph");
  $("view").classList.toggle("on", m === "view");
  $("glabel").textContent = label; $("gbadge").textContent = badge;
  $("gbadge").style.display = badge ? "" : "none";
}
function panel(html) { $("panel").innerHTML = html; }
async function countUp(el, to, ms = 900) { const t0 = performance.now(); return new Promise((r) => { const f = (t) => { const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(to * k).toLocaleString("en-US"); k < 1 ? requestAnimationFrame(f) : r(); }; requestAnimationFrame(f); }); }

// ---------- engine ----------
let current = 0;
let step = 0;
let busy = false;

function renderDots() {
  $("dots").innerHTML = scenes.map((_, i) => `<button type="button" aria-label="Scene ${i + 1}" class="${i === current ? "on" : i < current ? "done" : ""}"></button>`).join("");
  [...$("dots").children].forEach((b, i) => b.addEventListener("click", () => show_scene(i)));
  $("count").textContent = `${current + 1} / ${scenes.length}`;
}
function renderButton() {
  const s = scenes[current];
  const b = $("go");
  if (step < s.actions.length) { b.textContent = s.actions[step]; b.classList.remove("next"); }
  else { b.textContent = current === scenes.length - 1 ? "Start over" : "Next →"; b.classList.add("next"); }
  $("back").disabled = current === 0;
}
function show_scene(i) {
  current = Math.max(0, Math.min(scenes.length - 1, i));
  step = 0;
  const s = scenes[current];
  $("kicker").textContent = s.kicker;
  $("title").textContent = s.title;
  $("body").innerHTML = s.body;
  s.enter?.();
  renderDots();
  renderButton();
}
async function go() {
  if (busy) return;
  const s = scenes[current];
  if (current === scenes.length - 1 && step >= s.actions.length - 1) { show_scene(0); return; }
  if (step < s.actions.length && s.act) {
    busy = true; $("go").disabled = true;
    try { await s.act(step); } finally { busy = false; $("go").disabled = false; }
    step += 1;
    renderButton();
    return;
  }
  show_scene(current + 1);
}
$("go").addEventListener("click", go);
$("back").addEventListener("click", () => show_scene(current - 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); go(); }
  if (e.key === "ArrowLeft") show_scene(current - 1);
});
drawGraph();
show_scene(0);
</script>
